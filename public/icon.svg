<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001428" />
      <stop offset="50%" stop-color="#0a2a4a" />
      <stop offset="100%" stop-color="#001428" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Neon Trim -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.35" />

  <!-- Barber Pole Spiral Accents (Subtle) -->
  <path d="M60 120 L120 60" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4" />
  <path d="M452 392 L392 452" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- Central Crest Circle -->
  <circle cx="256" cy="220" r="140" fill="#001e3d" stroke="url(#cyanGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Barber Scissors Icon -->
  <g transform="translate(146, 110) scale(0.45)" fill="none" stroke="#f8fafc" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Blade and Loop -->
    <path d="M120 400 A 40 40 0 1 1 120 320 L 320 120" stroke="url(#goldGrad)" stroke-width="24" />
    <!-- Right Blade and Loop -->
    <path d="M360 400 A 40 40 0 1 0 360 320 L 160 120" stroke="#f8fafc" stroke-width="24" />
    <!-- Center Screw Pivot -->
    <circle cx="240" cy="240" r="18" fill="#38bdf8" stroke="#ffffff" stroke-width="6" />
  </g>

  <!-- Straight Razor Accent -->
  <path d="M 200 300 Q 256 325 312 300" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- Typography: SMART SALON LK -->
  <text x="256" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#f8fafc" letter-spacing="3">
    SMART SALON
  </text>
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#38bdf8" letter-spacing="6">
    LK • ශ්‍රී ලංකා
  </text>
</svg>

